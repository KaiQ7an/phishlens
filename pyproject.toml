[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishlens"
version = "0.1.0"
description = "Explainable phishing email analysis: every point in the risk score comes with a reason."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "KaiQian Xue" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
phishlens = "phishlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
